<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
  /* Grille d'icône macOS : carré arrondi de 824 px centré, ombre portée. */
  .tile {
    position: absolute; left: 100px; top: 100px; width: 824px; height: 824px; border-radius: 185px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #2a1850 0%, #120d24 45%, #07060d 100%);
    box-shadow: 0 24px 48px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.12);
  }
  .blob { position: absolute; width: 520px; height: 520px; border-radius: 50%; filter: blur(70px); opacity: .55; mix-blend-mode: screen; }
  .stars { position: absolute; inset: 0; background-image:
    radial-gradient(3px 3px at 120px 150px, #fff9, transparent), radial-gradient(2px 2px at 640px 120px, #fff8, transparent),
    radial-gradient(2.5px 2.5px at 700px 300px, #ffe9b0aa, transparent), radial-gradient(2px 2px at 180px 360px, #cfe2ffaa, transparent),
    radial-gradient(2px 2px at 560px 200px, #fff6, transparent), radial-gradient(3px 3px at 90px 560px, #fff5, transparent); }
  svg { position: absolute; inset: 0; }
</style></head><body>
<div class="tile">
  <div class="blob" style="background:#00D2FF; left:-220px; top:420px"></div>
  <div class="blob" style="background:#B18CFF; left:300px; top:-260px"></div>
  <div class="blob" style="background:#FF6FB5; left:420px; top:470px"></div>
  <div class="blob" style="background:#B6F23A; left:-200px; top:-240px; opacity:.25"></div>
  <div class="stars"></div>
  <svg viewBox="0 0 824 824">
    <defs>
      <radialGradient id="sun" cx="42%" cy="36%" r="64%">
        <stop offset="0%" stop-color="#FFF8E0"/><stop offset="38%" stop-color="#FFD166"/><stop offset="78%" stop-color="#FF8A4C"/><stop offset="100%" stop-color="#E5418A"/>
      </radialGradient>
      <radialGradient id="halo" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFD166" stop-opacity=".8"/><stop offset="40%" stop-color="#FF8A4C" stop-opacity=".28"/><stop offset="100%" stop-color="#FF8A4C" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="ring" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="#00D2FF"/><stop offset="35%" stop-color="#B18CFF"/><stop offset="68%" stop-color="#FF6FB5"/><stop offset="100%" stop-color="#B6F23A"/>
      </linearGradient>
      <radialGradient id="shine" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#fff" stop-opacity=".85"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
    </defs>
    <g transform="rotate(-18 412 412)">
      <!-- moitié arrière de l'orbite, derrière le soleil -->
      <path d="M92 412 A320 118 0 0 1 732 412" fill="none" stroke="url(#ring)" stroke-width="16" stroke-opacity=".55"/>
    </g>
    <circle cx="412" cy="412" r="270" fill="url(#halo)"/>
    <circle cx="412" cy="412" r="150" fill="url(#sun)"/>
    <circle cx="412" cy="412" r="150" fill="url(#shine)" opacity=".35"/>
    <g transform="rotate(-18 412 412)">
      <!-- moitié avant de l'orbite, devant le soleil -->
      <path d="M92 412 A320 118 0 0 0 732 412" fill="none" stroke="url(#ring)" stroke-width="16"/>
      <circle cx="118" cy="460" r="30" fill="#1B9CD8"/><circle cx="118" cy="460" r="30" fill="url(#shine)"/>
      <circle cx="300" cy="522" r="24" fill="#E85A26"/><circle cx="300" cy="522" r="24" fill="url(#shine)"/>
      <circle cx="530" cy="525" r="34" fill="#8F5CFF"/><circle cx="530" cy="525" r="34" fill="url(#shine)"/>
      <circle cx="700" cy="462" r="22" fill="#6CA81A"/><circle cx="700" cy="462" r="22" fill="url(#shine)"/>
      <circle cx="610" cy="318" r="18" fill="#E5418A" opacity=".9"/><circle cx="610" cy="318" r="18" fill="url(#shine)"/>
    </g>
  </svg>
</div>
</body></html>
