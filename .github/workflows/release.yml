# Publishes a release from a vX.Y.Z tag (lsuite standard §3): zenith.app for macOS arm64 and
# x86_64 (Developer ID signed and notarized when the six APPLE_* secrets are set), a Linux
# x86_64 archive, SHA256SUMS and its Ed25519 signature SHA256SUMS.sig, which the in-app updater
# checks against crates/zenith-commands/assets/update-signing.pub before installing anything.
# Asset names are stable: lsuite.xyz/zenith/download/<platform> and the updater find them.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            asset: zenith-macos-arm64.zip
          - os: macos-15-intel
            asset: zenith-macos-x86_64.zip
          - os: ubuntu-22.04
            asset: zenith-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml's version $version" >&2
            exit 1
          fi
      - name: Linux libraries (GPUI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-xkb-dev libxrandr-dev libxi-dev libfontconfig1-dev libfreetype6-dev libzstd-dev libssl-dev libasound2-dev
          echo 'CARGO_BUILD_JOBS=2' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Web interface (Open in Browser)
        run: npm ci && npm run code:build
      - run: cargo test --locked -p zenith-client -p zenith-model -p zenith-commands -p zenith-app
      - run: cargo build --release --locked -p zenith-app -p zenith-code -p zenith-commands
      - name: Developer ID signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/mac/prepare-signing.sh
      - name: Package zenith.app
        if: runner.os == 'macOS'
        run: bash scripts/mac/package.sh
      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db"; fi
          rm -f "$RUNNER_TEMP/notary.p8"
      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/zenith-linux-x86_64.tar.gz -C target/release zenith zenith-code zenith-cli zenith-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum zenith-macos-arm64.zip zenith-macos-x86_64.zip zenith-linux-x86_64.tar.gz > SHA256SUMS
      - name: Sign the checksums
        env:
          ZENITH_UPDATE_SIGNING_KEY: ${{ secrets.ZENITH_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$ZENITH_UPDATE_SIGNING_KEY" ]; then
            echo 'The ZENITH_UPDATE_SIGNING_KEY secret is not set: installed apps refuse unsigned releases.' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/zenith"
          tar -xzf dist/zenith-linux-x86_64.tar.gz -C "$RUNNER_TEMP/zenith" zenith-cli
          "$RUNNER_TEMP/zenith/zenith-cli" release sign dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="See https://lsuite.xyz/zenith for what changed."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/zenith-macos-arm64.zip dist/zenith-macos-x86_64.zip dist/zenith-linux-x86_64.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig --clobber
          else
            gh release create "$tag" --title "zenith ${tag#v}" --notes "$notes" \
              dist/zenith-macos-arm64.zip dist/zenith-macos-x86_64.zip dist/zenith-linux-x86_64.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig
          fi
