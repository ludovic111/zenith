[package]
name = "zc-http"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zenith code: shared HTTP pieces (static SPA, CSP, embed config, CORS, readiness gate, typed errors, /ws glue)"

[dependencies]
zc-rpc = { path = "../zc-rpc" }
async-trait = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
http = "1"
httpdate = "1"
mime_guess = "2"
rand = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { workspace = true }
tracing = { workspace = true }
url = "2"
# `/ws` with permessage-deflate (tungstenite, behind axum's ws, has none).
yawc = { version = "0.4", default-features = false, features = ["axum"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
