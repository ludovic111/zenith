[package]
name = "zc-vcs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zenith code in Rust: the git driver (status, refs, worktrees, review diffs, checkpoints), the VCS registry, the status broadcaster, the git workflow and the review service"

[dependencies]
zc-core = { path = "../zc-core" }
zc-ports = { path = "../zc-ports" }
zc-rpc = { path = "../zc-rpc" }
async-trait = { workspace = true }
futures = { workspace = true }
icu_collator = "2"
libc = "0.2"
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = "2"
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
