[package]
name = "zc-pullrequest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zenith code in Rust: the pull request service, its caches, the forge providers (GitHub, GitLab, Forgejo, Azure DevOps, Bitbucket), the pullRequests.* RPCs, POST /api/pull-requests/diff and the PR reactors"

[dependencies]
zc-contracts = { path = "../zc-contracts" }
zc-core = { path = "../zc-core" }
zc-db = { path = "../zc-db" }
zc-http = { path = "../zc-http" }
zc-ports = { path = "../zc-ports" }
zc-projections = { path = "../zc-projections" }
zc-reactors = { path = "../zc-reactors" }
zc-rpc = { path = "../zc-rpc" }
zc-sourcecontrol = { path = "../zc-sourcecontrol" }
zc-vcs = { path = "../zc-vcs" }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
jiff = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
similar = "2"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { workspace = true }
url = "2"
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["test-util"] }
