[package]
name = "zc-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zenith code in Rust: the /mcp server the agents call back into (session registry, toolkits, preview automation broker)"

[dependencies]
zc-contracts = { path = "../zc-contracts" }
zc-core = { path = "../zc-core" }
zc-db = { path = "../zc-db" }
zc-ports = { path = "../zc-ports" }
zc-projections = { path = "../zc-projections" }
zc-providers = { path = "../zc-providers" }
zc-rpc = { path = "../zc-rpc" }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
