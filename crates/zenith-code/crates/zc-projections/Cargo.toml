[package]
name = "zc-projections"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zenith code in Rust: the orchestration projections (SQL projectors, snapshot queries, live subscriptions, orchestration HTTP routes)"

[dependencies]
zc-contracts = { path = "../zc-contracts" }
zc-core = { path = "../zc-core" }
zc-db = { path = "../zc-db" }
zc-orchestration = { path = "../zc-orchestration" }
zc-http = { path = "../zc-http" }
zc-ports = { path = "../zc-ports" }
zc-rpc = { path = "../zc-rpc" }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
http = "1"
regex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
