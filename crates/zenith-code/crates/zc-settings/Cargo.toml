[package]
name = "zc-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zenith code: server settings (sparse settings.json, secrets, folding), keybindings (+ the `when` parser), environment themes, and the server config RPCs"

[dependencies]
zc-contracts = { path = "../zc-contracts" }
zc-core = { path = "../zc-core" }
zc-db = { path = "../zc-db" }
zc-ports = { path = "../zc-ports" }
zc-rpc = { path = "../zc-rpc" }
async-trait = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
libc = "0.2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
regex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
