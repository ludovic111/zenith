[package]
name = "zc-git"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zenith code in Rust: GitManager (stacked commit/push/PR actions with progress, the PR lookups behind VCS status and thread settlement, PR resolve/prepare) and the git.* RPCs"

[dependencies]
zc-contracts = { path = "../zc-contracts" }
zc-core = { path = "../zc-core" }
zc-db = { path = "../zc-db" }
zc-orchestration = { path = "../zc-orchestration" }
zc-ports = { path = "../zc-ports" }
zc-rpc = { path = "../zc-rpc" }
zc-settings = { path = "../zc-settings" }
zc-sourcecontrol = { path = "../zc-sourcecontrol" }
zc-textgen = { path = "../zc-textgen" }
zc-vcs = { path = "../zc-vcs" }
async-trait = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = "2"

[dev-dependencies]
tempfile = "3"
regex = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
