[package]
name = "zenith-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zenith: a client of the running zenith server (WebSocket RPC with a bearer session), shared by the window, zenith-cli and zenith-mcp"

[dependencies]
zc-contracts = { path = "../zenith-code/crates/zc-contracts" }
anyhow = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# rustls with webpki roots: remote servers are reached over wss:// (Tailscale Serve).
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
