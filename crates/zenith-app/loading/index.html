<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>zenith</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; color: #71717b; font: 13px -apple-system, system-ui, sans-serif; display: grid; place-items: center; -webkit-user-select: none; cursor: default }
      .spin { width: 18px; height: 18px; margin: 0 auto 14px; border-radius: 50%; border: 2px solid rgba(128, 128, 128, 0.25); border-top-color: #71717b; animation: s 0.8s linear infinite }
      @keyframes s { to { transform: rotate(360deg) } }
      p { text-align: center; margin: 4px 0 }
      b { font-weight: 600; color: CanvasText }
    </style>
  </head>
  <body data-tauri-drag-region>
    <!-- Shown while the local server starts; the app writes the message (src/main.rs). -->
    <div data-tauri-drag-region>
      <div class="spin"></div>
      <p><b>zenith</b></p>
      <p id="message"></p>
    </div>
  </body>
</html>
